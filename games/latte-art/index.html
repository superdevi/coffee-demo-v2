<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0f">
  <title>拉花 · Latte Art — 8.88</title>
  <link rel="stylesheet" href="/shared/theme.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <a href="/" class="back-btn">←</a>
  <div class="bg-glow"></div>

  <!-- ====== GAME SCREEN ====== -->
  <div id="game-screen" class="screen game-screen">

    <!-- Cup SVG -->
    <div class="cup-container">
      <div class="heartbeat-ring"></div>
      <div class="overflow-ring"></div>

      <!-- Pour stream -->
      <div class="pour-stream"></div>

      <!-- Steam -->
      <div class="steam-container">
        <div class="steam"></div>
        <div class="steam"></div>
        <div class="steam"></div>
      </div>

      <svg class="cup-svg" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Crema gradient -->
          <radialGradient id="crema-gradient" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#c8956a"/>
            <stop offset="40%" stop-color="#a0714e"/>
            <stop offset="80%" stop-color="#5a3825"/>
            <stop offset="100%" stop-color="#3d2216"/>
          </radialGradient>

          <!-- Reveal mask -->
          <radialGradient id="reveal-gradient" cx="50%" cy="55%" r="50%"
                          gradientUnits="objectBoundingBox">
            <stop offset="70%" stop-color="white"/>
            <stop offset="100%" stop-color="black"/>
          </radialGradient>

          <mask id="reveal-mask">
            <circle id="reveal-mask-circle" cx="130" cy="138" r="0" fill="url(#reveal-gradient)"/>
          </mask>
        </defs>

        <!-- Cup outer rim -->
        <circle cx="130" cy="130" r="120" fill="none" stroke="#8a7a6a" stroke-width="3" opacity="0.3"/>

        <!-- Cup inner rim -->
        <circle cx="130" cy="130" r="112" fill="none" stroke="#6a5a4a" stroke-width="1.5" opacity="0.2"/>

        <!-- Coffee surface (crema) -->
        <circle cx="130" cy="130" r="108" fill="url(#crema-gradient)"/>

        <!-- Crema speckle texture -->
        <g opacity="0.15">
          <circle cx="100" cy="110" r="1" fill="#d4a574"/>
          <circle cx="150" cy="100" r="0.8" fill="#d4a574"/>
          <circle cx="120" cy="155" r="1.2" fill="#d4a574"/>
          <circle cx="165" cy="140" r="0.7" fill="#d4a574"/>
          <circle cx="90" cy="145" r="0.9" fill="#d4a574"/>
          <circle cx="140" cy="165" r="0.6" fill="#d4a574"/>
          <circle cx="110" cy="125" r="1" fill="#d4a574"/>
          <circle cx="155" cy="120" r="0.8" fill="#d4a574"/>
          <circle cx="130" cy="95" r="0.5" fill="#d4a574"/>
          <circle cx="95" cy="130" r="0.7" fill="#d4a574"/>
          <circle cx="170" cy="155" r="0.6" fill="#d4a574"/>
        </g>

        <!-- Milk impact glow (visible while pouring) -->
        <circle id="milk-glow" cx="130" cy="138" r="0" fill="rgba(255,255,255,0.15)" style="opacity:0"/>

        <!-- ===== LOTUS LATTE ART ===== -->
        <g mask="url(#reveal-mask)">
          <!-- Center dot -->
          <circle cx="130" cy="130" r="10" fill="#f0e6d6" opacity="0.9"/>

          <!-- Inner petals (5, wide) -->
          <path d="M130,120 Q114,100 130,78 Q146,100 130,120Z" fill="#f0e6d6" opacity="0.9"/>
          <path d="M140,124 Q162,108 178,86 Q154,114 140,124Z" fill="#f0e6d6" opacity="0.85"/>
          <path d="M138,138 Q162,146 182,136 Q158,150 138,138Z" fill="#ede0d0" opacity="0.85"/>
          <path d="M122,138 Q98,146 78,136 Q102,150 122,138Z" fill="#ede0d0" opacity="0.85"/>
          <path d="M120,124 Q98,108 82,86 Q106,114 120,124Z" fill="#f0e6d6" opacity="0.85"/>

          <!-- Outer petals (5, large, wide) -->
          <path d="M130,116 Q110,76 130,40 Q150,76 130,116Z" fill="#e8d8c5" opacity="0.7"/>
          <path d="M142,120 Q178,92 208,66 Q170,100 142,120Z" fill="#e3d0bb" opacity="0.65"/>
          <path d="M140,142 Q176,158 210,154 Q172,166 140,142Z" fill="#ddc8b0" opacity="0.6"/>
          <path d="M120,142 Q84,158 50,154 Q88,166 120,142Z" fill="#ddc8b0" opacity="0.6"/>
          <path d="M118,120 Q82,92 52,66 Q90,100 118,120Z" fill="#e3d0bb" opacity="0.65"/>

          <!-- Bottom petals (3, filling lower half) -->
          <path d="M130,144 Q112,178 130,212 Q148,178 130,144Z" fill="#e8d8c5" opacity="0.65"/>
          <path d="M120,140 Q86,170 64,204 Q94,168 120,140Z" fill="#ddc8b0" opacity="0.55"/>
          <path d="M140,140 Q174,170 196,204 Q166,168 140,140Z" fill="#ddc8b0" opacity="0.55"/>

          <!-- Inner detail lines -->
          <line x1="130" y1="120" x2="130" y2="84" stroke="#d4a574" stroke-width="1.5" opacity="0.3"/>
          <line x1="140" y1="124" x2="166" y2="100" stroke="#d4a574" stroke-width="1.5" opacity="0.3"/>
          <line x1="138" y1="138" x2="170" y2="140" stroke="#d4a574" stroke-width="1.5" opacity="0.3"/>
          <line x1="122" y1="138" x2="90" y2="140" stroke="#d4a574" stroke-width="1.5" opacity="0.3"/>
          <line x1="120" y1="124" x2="94" y2="100" stroke="#d4a574" stroke-width="1.5" opacity="0.3"/>
        </g>

        <!-- Cup rim (on top of everything) -->
        <circle cx="130" cy="130" r="118" fill="none" stroke="#a89070" stroke-width="5" opacity="0.25"/>
        <!-- Rim highlight -->
        <path d="M40,100 A118,118 0 0,1 130,12" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>
      </svg>
    </div>

    <!-- Timer -->
    <div class="timer text-mono">0.00</div>

    <!-- Pour Button -->
    <div class="pour-btn-area">
      <button class="pour-btn" data-zh="倒奶" data-en="POUR">倒奶</button>
      <div class="pour-hint" data-zh="按住倒奶" data-en="Hold to Pour">按住倒奶</div>
    </div>
  </div>

  <!-- ====== RESULT SCREEN ====== -->
  <div id="result-screen" class="screen result-screen hidden">

    <!-- Mini cup showing revealed state -->
    <svg id="result-cup-svg" class="result-cup" viewBox="0 0 110 110" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="result-crema" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#c8956a"/>
          <stop offset="40%" stop-color="#a0714e"/>
          <stop offset="80%" stop-color="#5a3825"/>
          <stop offset="100%" stop-color="#3d2216"/>
        </radialGradient>
        <radialGradient id="result-reveal-grad" cx="50%" cy="55%" r="50%"
                        gradientUnits="objectBoundingBox">
          <stop offset="70%" stop-color="white"/>
          <stop offset="100%" stop-color="black"/>
        </radialGradient>
        <mask id="result-reveal-mask">
          <circle id="result-reveal-circle" cx="55" cy="58" r="0" fill="url(#result-reveal-grad)"/>
        </mask>
      </defs>
      <circle cx="55" cy="55" r="50" fill="url(#result-crema)"/>
      <g mask="url(#result-reveal-mask)">
        <!-- Center -->
        <circle cx="55" cy="55" r="5" fill="#f0e6d6" opacity="0.9"/>
        <!-- Inner petals -->
        <path d="M55,50 Q48,40 55,30 Q62,40 55,50Z" fill="#f0e6d6" opacity="0.9"/>
        <path d="M60,52 Q72,44 80,34 Q68,48 60,52Z" fill="#f0e6d6" opacity="0.85"/>
        <path d="M59,59 Q72,63 82,58 Q70,65 59,59Z" fill="#ede0d0" opacity="0.85"/>
        <path d="M51,59 Q38,63 28,58 Q40,65 51,59Z" fill="#ede0d0" opacity="0.85"/>
        <path d="M50,52 Q38,44 30,34 Q42,48 50,52Z" fill="#f0e6d6" opacity="0.85"/>
        <!-- Outer petals -->
        <path d="M55,48 Q46,30 55,14 Q64,30 55,48Z" fill="#e8d8c5" opacity="0.7"/>
        <path d="M61,50 Q78,38 90,26 Q74,42 61,50Z" fill="#e3d0bb" opacity="0.65"/>
        <path d="M60,61 Q76,68 90,66 Q74,72 60,61Z" fill="#ddc8b0" opacity="0.6"/>
        <path d="M50,61 Q34,68 20,66 Q36,72 50,61Z" fill="#ddc8b0" opacity="0.6"/>
        <path d="M49,50 Q32,38 20,26 Q36,42 49,50Z" fill="#e3d0bb" opacity="0.65"/>
        <!-- Bottom petals -->
        <path d="M55,62 Q48,76 55,90 Q62,76 55,62Z" fill="#e8d8c5" opacity="0.65"/>
        <path d="M50,60 Q36,74 26,88 Q40,72 50,60Z" fill="#ddc8b0" opacity="0.55"/>
        <path d="M60,60 Q74,74 84,88 Q70,72 60,60Z" fill="#ddc8b0" opacity="0.55"/>
      </g>
      <circle cx="55" cy="55" r="49" fill="none" stroke="#a89070" stroke-width="2.5" opacity="0.25"/>
    </svg>

    <div id="result-time" class="result-time">0.00</div>
    <div id="result-delta" class="result-delta">+0.00s</div>
    <div id="result-grade" class="result-grade">—</div>
    <div id="result-message" class="result-message"></div>

    <div class="taopunk-divider"></div>

    <!-- Leaderboard -->
    <div id="leaderboard-container"></div>

    <!-- Actions -->
    <div class="result-actions">
      <button id="btn-again" class="btn btn-primary" data-zh="再来" data-en="Again">再来</button>
      <a href="/" class="btn" data-zh="换游戏" data-en="Switch">换游戏</a>
    </div>
  </div>

  <script type="module" src="./game.js"></script>
</body>
</html>
