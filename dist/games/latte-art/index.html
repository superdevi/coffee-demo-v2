<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0f">
  <title>拉花 · Latte Art — 8.88</title>

  <link rel="modulepreload" crossorigin href="/assets/utils-CBdnpe-u.js">
  <link rel="stylesheet" crossorigin href="/assets/i18n-BG_Cl_Wu.css">

</head>
<body>
  <a href="/" class="back-btn">←</a>
  <div class="bg-glow"></div>

  <!-- ====== GAME SCREEN ====== -->
  <div id="game-screen" class="screen game-screen">

    <!-- Cup SVG -->
    <div class="cup-container">
      <div class="heartbeat-ring"></div>
      <div class="overflow-ring"></div>

      <!-- Pour stream -->
      <div class="pour-stream"></div>

      <!-- Steam -->
      <div class="steam-container">
        <div class="steam"></div>
        <div class="steam"></div>
        <div class="steam"></div>
      </div>

      <svg class="cup-svg" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Crema gradient -->
          <radialGradient id="crema-gradient" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#c8956a"/>
            <stop offset="40%" stop-color="#a0714e"/>
            <stop offset="80%" stop-color="#5a3825"/>
            <stop offset="100%" stop-color="#3d2216"/>
          </radialGradient>

          <!-- Reveal mask -->
          <radialGradient id="reveal-gradient" cx="50%" cy="55%" r="50%"
                          gradientUnits="objectBoundingBox">
            <stop offset="70%" stop-color="white"/>
            <stop offset="100%" stop-color="black"/>
          </radialGradient>

          <mask id="reveal-mask">
            <circle id="reveal-mask-circle" cx="130" cy="138" r="0" fill="url(#reveal-gradient)"/>
          </mask>
        </defs>

        <!-- Cup outer rim -->
        <circle cx="130" cy="130" r="120" fill="none" stroke="#8a7a6a" stroke-width="3" opacity="0.3"/>

        <!-- Cup inner rim -->
        <circle cx="130" cy="130" r="112" fill="none" stroke="#6a5a4a" stroke-width="1.5" opacity="0.2"/>

        <!-- Coffee surface (crema) -->
        <circle cx="130" cy="130" r="108" fill="url(#crema-gradient)"/>

        <!-- Crema speckle texture -->
        <g opacity="0.15">
          <circle cx="100" cy="110" r="1" fill="#d4a574"/>
          <circle cx="150" cy="100" r="0.8" fill="#d4a574"/>
          <circle cx="120" cy="155" r="1.2" fill="#d4a574"/>
          <circle cx="165" cy="140" r="0.7" fill="#d4a574"/>
          <circle cx="90" cy="145" r="0.9" fill="#d4a574"/>
          <circle cx="140" cy="165" r="0.6" fill="#d4a574"/>
          <circle cx="110" cy="125" r="1" fill="#d4a574"/>
          <circle cx="155" cy="120" r="0.8" fill="#d4a574"/>
          <circle cx="130" cy="95" r="0.5" fill="#d4a574"/>
          <circle cx="95" cy="130" r="0.7" fill="#d4a574"/>
          <circle cx="170" cy="155" r="0.6" fill="#d4a574"/>
        </g>

        <!-- Milk impact glow (visible while pouring) -->
        <circle id="milk-glow" cx="130" cy="138" r="0" fill="rgba(255,255,255,0.15)" style="opacity:0"/>

        <!-- ===== LOTUS LATTE ART ===== -->
        <g mask="url(#reveal-mask)">
          <!-- Center dot -->
          <circle cx="130" cy="130" r="6" fill="#f0e6d6" opacity="0.9"/>

          <!-- Inner petals (5, small) -->
          <path d="M130,124 Q122,108 130,92 Q138,108 130,124Z" fill="#f0e6d6" opacity="0.9"/>
          <path d="M136,126 Q152,116 162,100 Q148,118 136,126Z" fill="#f0e6d6" opacity="0.85"/>
          <path d="M134,134 Q152,138 168,130 Q150,140 134,134Z" fill="#ede0d0" opacity="0.85"/>
          <path d="M126,134 Q108,138 92,130 Q110,140 126,134Z" fill="#ede0d0" opacity="0.85"/>
          <path d="M124,126 Q108,116 98,100 Q112,118 124,126Z" fill="#f0e6d6" opacity="0.85"/>

          <!-- Outer petals (5, large, offset rotation) -->
          <path d="M130,120 Q118,88 130,58 Q142,88 130,120Z" fill="#e8d8c5" opacity="0.7"/>
          <path d="M138,124 Q168,104 192,82 Q162,112 138,124Z" fill="#e3d0bb" opacity="0.65"/>
          <path d="M136,138 Q166,148 194,148 Q164,154 136,138Z" fill="#ddc8b0" opacity="0.6"/>
          <path d="M124,138 Q94,148 66,148 Q96,154 124,138Z" fill="#ddc8b0" opacity="0.6"/>
          <path d="M122,124 Q92,104 68,82 Q98,112 122,124Z" fill="#e3d0bb" opacity="0.65"/>

          <!-- Bottom petals (3, filling lower half) -->
          <path d="M130,140 Q118,168 130,198 Q142,168 130,140Z" fill="#e8d8c5" opacity="0.65"/>
          <path d="M124,138 Q96,162 78,188 Q102,160 124,138Z" fill="#ddc8b0" opacity="0.55"/>
          <path d="M136,138 Q164,162 182,188 Q158,160 136,138Z" fill="#ddc8b0" opacity="0.55"/>

          <!-- Inner detail lines -->
          <line x1="130" y1="124" x2="130" y2="96" stroke="#d4a574" stroke-width="1" opacity="0.3"/>
          <line x1="136" y1="126" x2="156" y2="108" stroke="#d4a574" stroke-width="1" opacity="0.3"/>
          <line x1="134" y1="134" x2="158" y2="134" stroke="#d4a574" stroke-width="1" opacity="0.3"/>
          <line x1="126" y1="134" x2="102" y2="134" stroke="#d4a574" stroke-width="1" opacity="0.3"/>
          <line x1="124" y1="126" x2="104" y2="108" stroke="#d4a574" stroke-width="1" opacity="0.3"/>
        </g>

        <!-- Cup rim (on top of everything) -->
        <circle cx="130" cy="130" r="118" fill="none" stroke="#a89070" stroke-width="5" opacity="0.25"/>
        <!-- Rim highlight -->
        <path d="M40,100 A118,118 0 0,1 130,12" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>
      </svg>
    </div>

    <!-- Timer -->
    <div class="timer text-mono">0.00</div>

    <!-- Pour Button -->
    <div class="pour-btn-area">
      <button class="pour-btn" data-zh="倒奶" data-en="POUR">倒奶</button>
      <div class="pour-hint" data-zh="按住倒奶" data-en="Hold to Pour">按住倒奶</div>
    </div>
  </div>

  <!-- ====== RESULT SCREEN ====== -->
  <div id="result-screen" class="screen result-screen hidden">

    <!-- Mini cup showing revealed state -->
    <svg id="result-cup-svg" class="result-cup" viewBox="0 0 110 110" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="result-crema" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#c8956a"/>
          <stop offset="40%" stop-color="#a0714e"/>
          <stop offset="80%" stop-color="#5a3825"/>
          <stop offset="100%" stop-color="#3d2216"/>
        </radialGradient>
        <radialGradient id="result-reveal-grad" cx="50%" cy="55%" r="50%"
                        gradientUnits="objectBoundingBox">
          <stop offset="70%" stop-color="white"/>
          <stop offset="100%" stop-color="black"/>
        </radialGradient>
        <mask id="result-reveal-mask">
          <circle id="result-reveal-circle" cx="55" cy="58" r="0" fill="url(#result-reveal-grad)"/>
        </mask>
      </defs>
      <circle cx="55" cy="55" r="50" fill="url(#result-crema)"/>
      <g mask="url(#result-reveal-mask)">
        <line x1="55" y1="88" x2="55" y2="22" stroke="#f0e6d6" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M55,85 Q38,79 30,72 Q39,77 55,82" fill="#f0e6d6" opacity="0.9"/>
        <path d="M55,85 Q72,79 80,72 Q71,77 55,82" fill="#f0e6d6" opacity="0.9"/>
        <path d="M55,74 Q40,69 33,62 Q41,67 55,71" fill="#ede0d0" opacity="0.88"/>
        <path d="M55,74 Q70,69 77,62 Q69,67 55,71" fill="#ede0d0" opacity="0.88"/>
        <path d="M55,63 Q43,59 38,53 Q44,57 55,61" fill="#e8d8c5" opacity="0.85"/>
        <path d="M55,63 Q67,59 72,53 Q66,57 55,61" fill="#e8d8c5" opacity="0.85"/>
        <path d="M55,52 Q46,49 43,44 Q47,48 55,50" fill="#e3d0bb" opacity="0.8"/>
        <path d="M55,52 Q64,49 67,44 Q63,48 55,50" fill="#e3d0bb" opacity="0.8"/>
        <path d="M55,30 Q50,24 48,28 Q48,32 55,37 Q62,32 62,28 Q60,24 55,30Z" fill="#f0e6d6" opacity="0.9"/>
      </g>
      <circle cx="55" cy="55" r="49" fill="none" stroke="#a89070" stroke-width="2.5" opacity="0.25"/>
    </svg>

    <div id="result-time" class="result-time">0.00</div>
    <div id="result-delta" class="result-delta">+0.00s</div>
    <div id="result-grade" class="result-grade">—</div>
    <div id="result-message" class="result-message"></div>

    <div class="taopunk-divider"></div>

    <!-- Leaderboard -->
    <div id="leaderboard-container"></div>

    <!-- Actions -->
    <div class="result-actions">
      <button id="btn-again" class="btn btn-primary" data-zh="再来" data-en="Again">再来</button>
      <a href="/" class="btn" data-zh="换游戏" data-en="Switch">换游戏</a>
    </div>
  </div>

</body>
</html>
