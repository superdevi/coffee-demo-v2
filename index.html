<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#231a14">
  <title>8.88 · SUPER DEVI</title>
  <link rel="stylesheet" href="/shared/theme.css">
  <style>
    .home {
      padding: 0;
      gap: 0;
      min-height: 100vh;
      min-height: 100dvh;
      justify-content: center;
      background:
        linear-gradient(180deg, rgba(18, 12, 8, 0.65) 0%, rgba(18, 12, 8, 0.45) 40%, rgba(18, 12, 8, 0.45) 60%, rgba(18, 12, 8, 0.65) 100%),
        url('/assets/bg_final/bg_wood_00000.png') center center / cover;
      background-color: var(--wood-base);
    }

    /*  Content panel */
    .content-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 380px;
      padding: var(--space-2xl) var(--space-xl);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(12px);
      border-left: 1px solid rgba(45, 212, 168, 0.06);
      border-right: 1px solid rgba(45, 212, 168, 0.06);
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      justify-content: center;
    }

    /* Cyberpunk accent glow on panel edges */
    .content-panel::before,
    .content-panel::after {
      content: '';
      position: absolute;
      top: 12%;
      bottom: 12%;
      width: 1px;
      background: linear-gradient(180deg,
          transparent,
          rgba(45, 212, 168, 0.12) 30%,
          rgba(45, 212, 168, 0.25) 50%,
          rgba(45, 212, 168, 0.12) 70%,
          transparent);
    }

    .content-panel::before {
      left: 0;
    }

    .content-panel::after {
      right: 0;
    }

    /* --- Brand --- */
    .brand {
      text-align: center;
      margin-bottom: var(--space-xl);
    }

    .brand-number {
      font-family: var(--font-mono);
      font-size: 3rem;
      font-weight: 200;
      color: var(--text-primary);
      line-height: 1;
      letter-spacing: 0.1em;
      text-shadow: 0 0 30px rgba(232, 201, 160, 0.15);
    }

    .brand-sub {
      font-size: 0.5rem;
      font-weight: 300;
      color: var(--text-muted);
      letter-spacing: 0.4em;
      margin-top: 14px;
    }

    /* --- Player HUD panel --- */
    .player-hud {
      max-width: 320px;
      padding: var(--space-lg);
      gap: var(--space-md);
    }

    .player-row {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      width: 100%;
    }

    .kawaii {
      width: 56px;
      height: 56px;
      flex-shrink: 0;
      animation: kawaii-float 4s ease-in-out infinite;
      filter: drop-shadow(0 4px 12px rgba(45, 212, 168, 0.1));
    }

    @keyframes kawaii-float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    .player-fields {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field .input {
      font-size: 0.75rem;
      padding: 10px 14px;
      letter-spacing: 0.12em;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(45, 212, 168, 0.12);
      box-shadow: inset 0 0 12px rgba(45, 212, 168, 0.03), 0 0 8px rgba(0, 0, 0, 0.3);
      color: var(--neon);
    }

    .field .input:focus {
      border-color: rgba(45, 212, 168, 0.4);
      box-shadow: inset 0 0 16px rgba(45, 212, 168, 0.06), 0 0 16px rgba(45, 212, 168, 0.1), var(--glow-neon);
      color: var(--neon);
      text-shadow: 0 0 8px rgba(45, 212, 168, 0.3);
    }

    .field .input::placeholder {
      color: rgba(45, 212, 168, 0.2);
    }

    /* --- Action buttons --- */
    .home-actions {
      margin-top: var(--space-xl);
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .home-actions .cyber-btn {
      padding: 16px;
      font-size: 0.65rem;
      letter-spacing: 0.25em;
    }

    /* --- Leaderboard overlay --- */
    .lb-overlay {
      position: fixed;
      inset: 0;
      z-index: 900;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-xl);
      animation: fadeIn var(--duration-fast) ease-out;
    }

    .lb-overlay .lb-close {
      margin-top: var(--space-lg);
    }

    /* --- Footer --- */
    .footer {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.4rem;
      font-weight: 200;
      letter-spacing: 0.3em;
      color: var(--text-muted);
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>

<body>
  <div class="screen home">
    <div class="content-panel">
      <div class="brand">
        <div class="brand-number">8.88</div>
        <div class="brand-sub">SUPER DEVI COFFEE</div>
      </div>

      <div class="hud-divider"></div>

      <div class="hud-panel player-hud">
        <div class="hud-panel-corner tl"></div>
        <div class="hud-panel-corner tr"></div>
        <div class="hud-panel-corner bl"></div>
        <div class="hud-panel-corner br"></div>
        <div class="hud-label" data-zh="玩家" data-en="PLAYER">玩家</div>
        <div class="player-row">
          <div class="player-fields">
            <div class="field">
              <input class="input" type="text" id="nickname" data-zh-placeholder="输入昵称" data-en-placeholder="NICKNAME"
                autocomplete="off">
            </div>
            <div class="field">
              <input class="input" type="text" id="company" data-zh-placeholder="公司名称" data-en-placeholder="COMPANY"
                autocomplete="off">
            </div>
          </div>
        </div>
      </div>

      <div class="home-actions">
        <a href="/games/latte-art/" class="cyber-btn cyber-btn--primary" data-zh="开始拉花"
          data-en="BEGIN LATTE ART">开始拉花</a>
        <button class="cyber-btn cyber-btn--ghost" id="lb-open" data-zh="排行榜" data-en="LEADERBOARD">排行榜</button>
      </div>
    </div>
  </div>

  <div class="footer" data-zh="SUPER DEVI · 为出海企业打造视觉体验"
    data-en="SUPER DEVI · VISUAL EXPERIENCES FOR COMPANIES GOING GLOBAL">SUPER DEVI · 为出海企业打造视觉体验</div>

  <script type="module">
    import { getNickname, setNickname, getCompany, setCompany } from '/shared/utils.js'
    import { fetchLeaderboard, renderLeaderboard } from '/shared/leaderboard.js'
    import { initLocale } from '/shared/i18n.js'
    const nicknameInput = document.getElementById('nickname')
    const companyInput = document.getElementById('company')

    nicknameInput.value = getNickname()
    companyInput.value = getCompany()

    nicknameInput.addEventListener('input', () => setNickname(nicknameInput.value))
    companyInput.addEventListener('input', () => setCompany(companyInput.value))

    document.getElementById('lb-open').addEventListener('click', async () => {
      const overlay = document.createElement('div')
      overlay.className = 'lb-overlay'
      overlay.innerHTML = `
        <div id="lb-home-container"></div>
        <button class="btn lb-close" data-zh="关闭" data-en="CLOSE">关闭</button>
      `
      document.body.appendChild(overlay)

      overlay.querySelector('.lb-close').addEventListener('click', () => overlay.remove())
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) overlay.remove()
      })

      const container = overlay.querySelector('#lb-home-container')
      const scores = await fetchLeaderboard('latte-art', 10)
      renderLeaderboard(container, scores, { game: 'latte-art', lowerIsBetter: true })
    })

    initLocale()
  </script>
</body>

</html>
