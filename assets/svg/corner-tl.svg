  <path d="M-12,140 C8,118 35,88 62,65 C66,62 55,72 40,88 C22,108 2,132 -12,140Z" fill="#5A9A8F" opacity="0.7"/>
  <path d="M42,0 C40,18 32,42 22,60 C20,64 25,52 32,38 C38,22 42,8 42,0Z" fill="#6B9E8A" opacity="0.65"/>
  <path d="M0,55 C15,42 35,25 52,15 C55,13 45,20 32,32 C18,45 5,55 0,55Z" fill="#5A9A8F" opacity="0.7"/>
  <path d="M80,0 C72,18 55,40 38,55 C35,58 42,48 55,35 C68,20 78,5 80,0Z" fill="#6B9E8A" opacity="0.6"/>

  <!-- === FRONT LAYER: Light leaves === -->
  <path d="M0,70 C12,58 28,42 45,30 C48,28 40,35 28,48 C15,62 4,72 0,70Z" fill="#8BA8A0" opacity="0.7"/>
  <path d="M20,0 C22,15 20,35 15,52 C14,55 16,42 18,30 C20,18 21,8 20,0Z" fill="#8BA8A0" opacity="0.65"/>
  <path d="M-5,45 C8,35 22,22 35,14 C38,12 30,18 20,28 C10,38 0,46 -5,45Z" fill="#A8C4B8" opacity="0.55"/>
  <path d="M50,0 C48,12 40,28 30,40 C28,43 34,35 40,25 C46,14 50,5 50,0Z" fill="#A8C4B8" opacity="0.5"/>

  <!-- === FLOWER CLUSTERS === -->
  <!-- Cluster 1: main (upper area) -->
  <g transform="translate(35,35)">
    <circle cx="0" cy="0" r="5" fill="#C47068" opacity="0.7"/>
    <circle cx="-5" cy="-4" r="4.5" fill="#D4887E" opacity="0.65"/>
    <circle cx="5" cy="-3" r="4" fill="#C47068" opacity="0.6"/>
    <circle cx="-3" cy="5" r="4.5" fill="#D4887E" opacity="0.55"/>
    <circle cx="4" cy="4" r="3.5" fill="#C47068" opacity="0.6"/>
    <circle cx="0" cy="-7" r="3.5" fill="#D4887E" opacity="0.5"/>
    <circle cx="-7" cy="0" r="3" fill="#B5635A" opacity="0.55"/>
    <circle cx="7" cy="0" r="3" fill="#D4887E" opacity="0.5"/>
    <!-- Petals detail -->
    <circle cx="0" cy="0" r="2" fill="#E8A8A0" opacity="0.5"/>
    <circle cx="-5" cy="-4" r="1.5" fill="#E8A8A0" opacity="0.4"/>
    <circle cx="5" cy="-3" r="1.5" fill="#E8A8A0" opacity="0.4"/>
  </g>

  <!-- Cluster 2: left side -->
  <g transform="translate(12,85)">
    <circle cx="0" cy="0" r="4.5" fill="#C47068" opacity="0.65"/>
    <circle cx="-4" cy="-3" r="4" fill="#D4887E" opacity="0.6"/>
    <circle cx="4" cy="-2" r="3.5" fill="#C47068" opacity="0.55"/>
    <circle cx="-2" cy="4" r="4" fill="#D4887E" opacity="0.5"/>
    <circle cx="3" cy="3" r="3" fill="#B5635A" opacity="0.55"/>
    <circle cx="-5" cy="2" r="3" fill="#D4887E" opacity="0.45"/>
    <circle cx="0" cy="-6" r="3" fill="#C47068" opacity="0.5"/>
    <circle cx="0" cy="0" r="1.5" fill="#E8A8A0" opacity="0.45"/>
  </g>

  <!-- Cluster 3: scattered singles -->
  <g transform="translate(58,55)">
    <circle cx="0" cy="0" r="4" fill="#C47068" opacity="0.6"/>
    <circle cx="-4" cy="-2" r="3.5" fill="#D4887E" opacity="0.55"/>
    <circle cx="3" cy="-3" r="3" fill="#C47068" opacity="0.5"/>
    <circle cx="-2" cy="3" r="3.5" fill="#D4887E" opacity="0.5"/>
    <circle cx="4" cy="2" r="3" fill="#B5635A" opacity="0.5"/>
    <circle cx="0" cy="0" r="1.5" fill="#E8A8A0" opacity="0.4"/>
  </g>

  <!-- Cluster 4: bottom edge -->
  <g transform="translate(25,120)">
    <circle cx="0" cy="0" r="4" fill="#C47068" opacity="0.55"/>
    <circle cx="-3" cy="-3" r="3.5" fill="#D4887E" opacity="0.5"/>
    <circle cx="3" cy="-2" r="3" fill="#C47068" opacity="0.45"/>
    <circle cx="0" cy="4" r="3.5" fill="#D4887E" opacity="0.45"/>
    <circle cx="-4" cy="2" r="3" fill="#B5635A" opacity="0.45"/>
    <circle cx="0" cy="0" r="1.2" fill="#E8A8A0" opacity="0.35"/>
  </g>

  <!-- Cluster 5: top scattered -->
  <g transform="translate(70,20)">
    <circle cx="0" cy="0" r="3.5" fill="#C47068" opacity="0.5"/>
    <circle cx="-3" cy="-2" r="3" fill="#D4887E" opacity="0.45"/>
    <circle cx="3" cy="2" r="2.5" fill="#B5635A" opacity="0.4"/>
    <circle cx="0" cy="0" r="1.2" fill="#E8A8A0" opacity="0.35"/>
  </g>

  <!-- Scattered individual petals -->
  <circle cx="5" cy="60" r="3" fill="#C47068" opacity="0.4"/>
  <circle cx="48" cy="8" r="2.5" fill="#D4887E" opacity="0.35"/>
  <circle cx="82" cy="42" r="2.5" fill="#C47068" opacity="0.3"/>
  <circle cx="15" cy="145" r="2.5" fill="#D4887E" opacity="0.3"/>

  <!-- Leaf veins -->
  <path d="M-8,100 L55,40" stroke="#3D6B5E" stroke-width="0.5" opacity="0.2"/>
  <path d="M-12,140 L62,65" stroke="#3D6B5E" stroke-width="0.5" opacity="0.15"/>
  <path d="M0,55 L52,15" stroke="#4A7D6A" stroke-width="0.4" opacity="0.15"/>
</svg>
