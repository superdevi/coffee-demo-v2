<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 280" fill="none">
  <!-- Top-left corner — lush botanical frame, style-1 reference -->

  <!-- === BACK LAYER: Large dark leaves === -->
  <path d="M-15,120 C5,100 30,70 55,50 C60,46 50,55 35,72 C20,90 0,112 -15,120Z" fill="#3D6B5E" opacity="0.85"/>
  <path d="M-10,160 C15,135 45,100 75,75 C80,70 68,82 50,100 C30,122 5,150 -10,160Z" fill="#4A7D6A" opacity="0.8"/>
  <path d="M30,0 C32,25 28,55 20,80 C18,86 22,72 26,55 C30,35 32,15 30,0Z" fill="#3D6B5E" opacity="0.75"/>
  <path d="M-5,80 C12,65 35,42 58,28 C62,25 52,35 38,50 C22,68 5,80 -5,80Z" fill="#4A7D6A" opacity="0.8"/>
  <path d="M60,0 C55,22 42,50 28,72 C25,77 32,65 42,48 C52,30 58,12 60,0Z" fill="#3D6B5E" opacity="0.7"/>

