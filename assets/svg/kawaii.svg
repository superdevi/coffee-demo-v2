<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Kawaii round coffee bean character — swap this file to change mascot -->

  <!-- Body (soft round) -->
  <ellipse cx="50" cy="54" rx="30" ry="32" fill="#DBA882"/>

  <!-- Body highlight -->
  <ellipse cx="42" cy="42" rx="14" ry="16" fill="#E8CDB0" opacity="0.5"/>

  <!-- Coffee bean line -->
  <path d="M50,28 C44,40 44,60 50,76" stroke="#B5635A" stroke-width="2" opacity="0.3" fill="none" stroke-linecap="round"/>

  <!-- Eyes (closed, happy) -->
  <path d="M38,50 C39,47 42,47 43,50" stroke="#4A6B6F" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M57,50 C58,47 61,47 62,50" stroke="#4A6B6F" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Blush -->
  <ellipse cx="35" cy="55" rx="5" ry="3" fill="#B5635A" opacity="0.2"/>
  <ellipse cx="65" cy="55" rx="5" ry="3" fill="#B5635A" opacity="0.2"/>

  <!-- Tiny mouth -->
  <ellipse cx="50" cy="58" rx="2.5" ry="1.5" fill="#4A6B6F" opacity="0.4"/>

  <!-- Steam wisps above head -->
  <path d="M42,20 C40,14 44,10 42,4" stroke="#8BA8A0" stroke-width="1" opacity="0.3" fill="none" stroke-linecap="round"/>
  <path d="M50,18 C48,12 52,8 50,2" stroke="#8BA8A0" stroke-width="1" opacity="0.25" fill="none" stroke-linecap="round"/>
  <path d="M58,20 C56,14 60,10 58,4" stroke="#8BA8A0" stroke-width="1" opacity="0.2" fill="none" stroke-linecap="round"/>
</svg>
