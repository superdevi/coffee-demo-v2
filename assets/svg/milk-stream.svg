<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 80" fill="none">
  <!-- Modular milk stream. Swap this file to change pour visual. -->
  <!-- Animated via CSS. Thin milk pour from jug spout. -->

  <!-- Main stream -->
  <path d="M10,0 C9,15 8,30 9,50 C10,65 10,75 10,80"
        stroke="white" stroke-width="4" opacity="0.85" stroke-linecap="round"/>

  <!-- Highlight -->
  <path d="M9,5 C8,20 8,35 9,55"
        stroke="white" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>

  <!-- Drip wobble shapes -->
  <ellipse cx="10" cy="78" rx="3" ry="2" fill="white" opacity="0.5"/>
</svg>
